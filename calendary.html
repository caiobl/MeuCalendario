<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário mensal</title>
    <script src="authGate.js"></script>
    <link rel="stylesheet" href="mycss.css">
</head>
<body>
    <main class="calendar-app">
        <header>
            <div><p class="eyebrow">A partir de hoje</p><h1>Meu calendário</h1></div>
            <div class="header-actions">
                <div class="month-navigation" aria-label="Navegação de meses">
                    <button id="previous-month" type="button" aria-label="Mês anterior">&larr;</button>
                    <span id="month-label"></span>
                    <button id="next-month" type="button" aria-label="Próximo mês">&rarr;</button>
                </div>
                <div class="menu-container">
                    <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="main-menu">
                        &larr;
                    </button>
                    <nav id="main-menu" class="main-menu" aria-label="Menu principal" aria-hidden="true">
                        <button type="button" data-menu-action="calendar">Calendário</button>
                        <span class="menu-separator" aria-hidden="true">=</span>
                        <button type="button" data-menu-action="films">Filmes</button>
                        <span class="menu-separator" aria-hidden="true">=</span>
                        <button type="button" data-menu-action="reads">Leituras</button>
                        <span class="menu-separator" aria-hidden="true">=</span>
                        <button type="button" data-menu-action="logout">Sair</button>
                    </nav>
                </div>
            </div>
        </header>
        <section aria-label="Calendário de próximos dias">
            <div id="calendar-grid" class="calendar-grid"></div>
        </section>
        <p class="hint">Selecione um dia para adicionar ou editar o que vai acontecer.</p>
    </main>
    <dialog id="edit-dialog">
        <div class="dialog-content">
            <div class="dialog-heading"><h2 id="dialog-title">Editar dia</h2><button id="close-dialog" class="close-button" type="button" aria-label="Fechar editor">&times;</button></div>
            <div id="notes-list" class="notes-list"></div>
            <button id="create-note" type="button">Criar nota</button>
            <div id="note-composer" hidden>
                <label for="note-title-input">Título da nota</label>
                <input id="note-title-input" type="text" placeholder="Dê um título para esta nota...">
                <label for="note-input">O que vai acontecer?</label>
                <textarea id="note-input" placeholder="Adicione uma nota para este dia..."></textarea>
                <div class="dialog-actions"><button id="cancel-note" type="button">Cancelar</button><button id="save-note" type="button">Salvar nota</button></div>
            </div>
        </div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabaseClient.js"></script>
    <script>
        const calendarGrid = document.querySelector('#calendar-grid');
        const monthLabel = document.querySelector('#month-label');
        const editDialog = document.querySelector('#edit-dialog');
        const notesList = document.querySelector('#notes-list');
        const createNoteButton = document.querySelector('#create-note');
        const noteComposer = document.querySelector('#note-composer');
        const noteTitleInput = document.querySelector('#note-title-input');
        const noteInput = document.querySelector('#note-input');
        const saveNoteButton = document.querySelector('#save-note');
        const cancelNoteButton = document.querySelector('#cancel-note');
        const dialogTitle = document.querySelector('#dialog-title');
        const previousMonthButton = document.querySelector('#previous-month');
        const nextMonthButton = document.querySelector('#next-month');
        const menuToggle = document.querySelector('#menu-toggle');
        const mainMenu = document.querySelector('#main-menu');
        const menuContainer = document.querySelector('.menu-container');
        const menuStateKey = 'menu-open';
        const currentDate = new Date();
        let displayedYear = currentDate.getFullYear();
        let displayedMonth = currentDate.getMonth();
        let allNotes = [];
        let activeYear = null;
        let activeMonth = null;
        let activeDay = null;
        let activeNotes = [];
        let editingNoteId = null;
        const isAdmin = siteRole === 'admin';
        const holidaysByYear = {};

        async function loadHolidays(year) {
            if (holidaysByYear[year]) return holidaysByYear[year];
            try {
                const response = await fetch(`https://brasilapi.com.br/api/feriados/v1/${year}`);
                if (!response.ok) throw new Error('Falha ao buscar feriados');
                holidaysByYear[year] = await response.json();
            } catch (error) {
                console.error(error);
                holidaysByYear[year] = [];
            }
            return holidaysByYear[year];
        }

        function getHoliday(year, month, day, holidays) {
            const dateKey = formatDateKey(year, month, day);
            return holidays.find((holiday) => holiday.date === dateKey);
        }

        function setMenuOpen(isOpen) {
            menuToggle.setAttribute('aria-expanded', String(isOpen));
            menuToggle.setAttribute('aria-label', isOpen ? 'Fechar menu' : 'Abrir menu');
            mainMenu.setAttribute('aria-hidden', String(!isOpen));
            menuContainer.classList.toggle('menu-open', isOpen);
            localStorage.setItem(menuStateKey, String(isOpen));
        }

        function formatDateKey(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        function getNotesForDate(year, month, day) {
            const dateKey = formatDateKey(year, month, day);
            return allNotes.filter((note) => note.note_date === dateKey);
        }

        async function loadNotes() {
            const { data, error } = await db.from('calendar_notes').select('*').order('created_at', { ascending: true });
            if (error) { console.error(error); allNotes = []; return; }
            allNotes = data;
        }

        function escapeHtml(text) {
            return text.replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
        }

        // Grows the note textarea to fit its content instead of relying on a fixed
        // height or a manual drag-resize handle.
        function autoGrowNoteInput() {
            noteInput.style.height = 'auto';
            noteInput.style.height = `${noteInput.scrollHeight}px`;
        }

        function getNextEvent() {
            const today = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
            let nextEvent = null;

            for (const note of allNotes) {
                const [noteYear, noteMonth, noteDay] = note.note_date.split('-').map(Number);
                const eventDate = new Date(noteYear, noteMonth - 1, noteDay);
                const isLaterMonth = eventDate.getFullYear() > today.getFullYear()
                    || (eventDate.getFullYear() === today.getFullYear() && eventDate.getMonth() > today.getMonth());
                if (!isLaterMonth || (nextEvent && eventDate >= nextEvent)) continue;
                nextEvent = eventDate;
            }

            return nextEvent;
        }

        function formatTimeUntil(eventDate) {
            const today = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
            const daysUntil = Math.max(0, Math.round((eventDate - today) / 86400000));
            if (daysUntil >= 365) {
                const years = Math.floor(daysUntil / 365);
                return `${years} ${years === 1 ? 'ano' : 'anos'}`;
            }
            if (daysUntil >= 30) {
                const months = Math.floor(daysUntil / 30);
                return `${months} ${months === 1 ? 'mês' : 'meses'}`;
            }
            if (daysUntil >= 7) {
                const weeks = Math.floor(daysUntil / 7);
                return `${weeks} ${weeks === 1 ? 'semana' : 'semanas'}`;
            }
            return `${daysUntil} ${daysUntil === 1 ? 'dia' : 'dias'}`;
        }

        async function renderCalendar() {
            const year = displayedYear;
            const month = displayedMonth;
            const isCurrentMonth = year === currentDate.getFullYear() && month === currentDate.getMonth();
            const firstVisibleDay = isCurrentMonth ? currentDate.getDate() : 1;
            const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
            const lastVisibleDay = isCurrentMonth ? Math.min(lastDayOfMonth, firstVisibleDay + 29) : lastDayOfMonth;
            const visibleDays = lastVisibleDay - firstVisibleDay + 1;
            const monthName = new Date(year, month).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            const nextMonth = month === 11 ? 0 : month + 1;
            const nextMonthYear = month === 11 ? year + 1 : year;
            const [holidays, nextYearHolidays] = await Promise.all([loadHolidays(year), loadHolidays(nextMonthYear)]);
            monthLabel.textContent = monthName;
            calendarGrid.classList.toggle('five-rows', !isCurrentMonth);
            previousMonthButton.disabled = isCurrentMonth;
            previousMonthButton.setAttribute('aria-label', 'Mês anterior');
            nextMonthButton.setAttribute('aria-label', 'Próximo mês');
            calendarGrid.innerHTML = '';

            for (let dayOffset = 0; dayOffset < visibleDays; dayOffset += 1) {
                const day = firstVisibleDay + dayOffset;
                const dayElement = document.createElement('button');
                const notes = getNotesForDate(year, month, day);
                const holiday = getHoliday(year, month, day, holidays);
                dayElement.className = ['day', isCurrentMonth && day === currentDate.getDate() ? 'today' : '', holiday ? 'holiday' : ''].filter(Boolean).join(' ');
                dayElement.type = 'button';
                const holidayMarker = !isCurrentMonth && holiday ? `<span class="holiday-marker" title="${escapeHtml(holiday.name)}">★</span>` : '';
                const futureMonthBadge = !isCurrentMonth ? `<span class="future-note-count">${notes.length}</span>` : '';
                const previewText = holiday ? `🎉 ${holiday.name}` : (notes[0]?.title || 'Nenhum evento');
                const currentMonthDetails = isCurrentMonth ? `<span class="day-preview">${escapeHtml(previewText)}</span><span class="event-count">${notes.length} ${notes.length === 1 ? 'evento' : 'eventos'}</span>` : '';
                dayElement.innerHTML = `<span class="day-number">${day}</span><span class="day-name">${new Date(year, month, day).toLocaleDateString('pt-BR', { weekday: 'short' })}</span>${holidayMarker}${futureMonthBadge}${currentMonthDetails}`;
                dayElement.addEventListener('click', () => openEditor(year, month, day, monthName));
                calendarGrid.appendChild(dayElement);
            }

            if (!isCurrentMonth) {
                const totalMonthSlots = 35;
                const trailingDays = totalMonthSlots - visibleDays;

                for (let day = 1; day <= trailingDays; day += 1) {
                    const adjacentDay = document.createElement('div');
                    const notes = getNotesForDate(nextMonthYear, nextMonth, day);
                    const holiday = getHoliday(nextMonthYear, nextMonth, day, nextYearHolidays);
                    adjacentDay.className = holiday ? 'adjacent-day holiday' : 'adjacent-day';
                    const holidayMarker = holiday ? `<span class="holiday-marker" title="${escapeHtml(holiday.name)}">★</span>` : '';
                    adjacentDay.innerHTML = `<span class="day-number">${day}</span><span class="day-name">${new Date(nextMonthYear, nextMonth, day).toLocaleDateString('pt-BR', { weekday: 'short' })}</span>${holidayMarker}${notes.length ? `<span class="future-note-count">${notes.length}</span>` : ''}`;
                    calendarGrid.appendChild(adjacentDay);
                }
            }

            if (isCurrentMonth) {
                const summary = document.createElement('div');
                const nextEvent = getNextEvent();
                summary.className = 'summary';
                summary.innerHTML = nextEvent
                    ? `<strong>Próximo evento em ${formatTimeUntil(nextEvent)}</strong><span>${nextEvent.toLocaleDateString('pt-BR')}</span>`
                    : '<strong>Nenhum evento futuro</strong><span>Adicione uma nota para agendar algo</span>';
                calendarGrid.appendChild(summary);
            }

        }

        previousMonthButton.addEventListener('click', () => {
            if (displayedYear === currentDate.getFullYear() && displayedMonth === currentDate.getMonth()) return;
            if (displayedMonth === 0) {
                displayedMonth = 11;
                displayedYear -= 1;
            } else {
                displayedMonth -= 1;
            }
            renderCalendar();
        });

        nextMonthButton.addEventListener('click', () => {
            if (displayedMonth === 11) {
                displayedMonth = 0;
                displayedYear += 1;
            } else {
                displayedMonth += 1;
            }
            renderCalendar();
        });

        function openEditor(year, month, day, monthName) {
            dialogTitle.textContent = `${monthName}, dia ${day}`;
            activeYear = year;
            activeMonth = month;
            activeDay = day;
            activeNotes = getNotesForDate(year, month, day);
            renderNotes();
            editDialog.showModal();
        }

        function renderNotes() {
            const holiday = getHoliday(activeYear, activeMonth, activeDay, holidaysByYear[activeYear] || []);
            const holidayBanner = holiday ? `<p class="holiday-banner">🎉 Feriado: ${escapeHtml(holiday.name)}</p>` : '';
            notesList.innerHTML = holidayBanner + (activeNotes.length
                ? activeNotes.map((note) => `<div class="saved-note"><div class="note-row"><p class="note-header">${escapeHtml(note.title)}</p>${isAdmin ? `<span class="note-actions"><button class="edit-note" type="button" data-edit-id="${note.id}">Editar nota</button><button class="delete-note" type="button" data-delete-id="${note.id}">Excluir nota</button></span>` : ''}</div><div class="note-body">${escapeHtml(note.body)}</div></div>`).join('')
                : '<p class="empty-notes">Ainda não há notas para este dia.</p>');
            noteComposer.hidden = true;
            createNoteButton.hidden = !isAdmin;
            editingNoteId = null;
            saveNoteButton.textContent = 'Salvar nota';
        }

        createNoteButton.addEventListener('click', () => {
            editingNoteId = null;
            noteComposer.hidden = false;
            createNoteButton.hidden = true;
            noteTitleInput.value = '';
            noteInput.value = '';
            saveNoteButton.textContent = 'Salvar nota';
            noteTitleInput.focus();
            autoGrowNoteInput();
        });
        cancelNoteButton.addEventListener('click', renderNotes);
        noteInput.addEventListener('input', autoGrowNoteInput);
        saveNoteButton.addEventListener('click', async () => {
            const title = noteTitleInput.value.trim();
            const body = noteInput.value.trim();
            if (!title || !body) return;
            if (editingNoteId) {
                const { error } = await db.from('calendar_notes').update({ title, body }).eq('id', editingNoteId);
                if (error) { console.error(error); return; }
            } else {
                const { error } = await db.from('calendar_notes').insert({ note_date: formatDateKey(activeYear, activeMonth, activeDay), title, body });
                if (error) { console.error(error); return; }
            }
            await loadNotes();
            activeNotes = getNotesForDate(activeYear, activeMonth, activeDay);
            renderNotes();
            renderCalendar();
        });
        notesList.addEventListener('click', async (event) => {
            const deleteButton = event.target.closest('.delete-note');
            if (deleteButton) {
                const noteId = deleteButton.dataset.deleteId;
                const note = activeNotes.find((item) => item.id === noteId);
                if (!note || !window.confirm(`Excluir a nota "${note.title}"?`)) return;
                const { error } = await db.from('calendar_notes').delete().eq('id', noteId);
                if (error) { console.error(error); return; }
                await loadNotes();
                activeNotes = getNotesForDate(activeYear, activeMonth, activeDay);
                renderNotes();
                renderCalendar();
                return;
            }
            const editButton = event.target.closest('.edit-note');
            if (editButton) {
                const noteId = editButton.dataset.editId;
                const note = activeNotes.find((item) => item.id === noteId);
                if (!note) return;
                editingNoteId = noteId;
                noteComposer.hidden = false;
                createNoteButton.hidden = true;
                noteTitleInput.value = note.title;
                noteInput.value = note.body;
                saveNoteButton.textContent = 'Salvar alterações';
                noteTitleInput.focus();
                autoGrowNoteInput();
                return;
            }
        });
        document.querySelector('#close-dialog').addEventListener('click', () => {
            editDialog.close();
        });
        editDialog.addEventListener('click', (event) => { if (event.target === editDialog) editDialog.close(); });

        function closeMenu() {
            setMenuOpen(false);
        }

        menuToggle.addEventListener('click', () => {
            const isOpen = menuContainer.classList.contains('menu-open');
            setMenuOpen(!isOpen);
        });
        document.querySelector('[data-menu-action="calendar"]').addEventListener('click', () => { window.location.href = 'calendary.html'; });
        document.querySelector('[data-menu-action="films"]').addEventListener('click', () => { window.location.href = 'movies.html'; });
        document.querySelector('[data-menu-action="reads"]').addEventListener('click', () => { window.location.href = 'reads.html'; });
        document.querySelector('[data-menu-action="logout"]').addEventListener('click', () => {
            localStorage.removeItem('site-role');
            window.location.href = 'main.html';
        });
        document.addEventListener('click', (event) => { if (!menuContainer.contains(event.target)) closeMenu(); });
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeMenu(); });
        if (localStorage.getItem(menuStateKey) === 'true') setMenuOpen(true);
        loadNotes().then(renderCalendar);
    </script>
</body>
</html>
